name: Issue 26 whitespace cleanup

on:
  pull_request:
    branches:
      - main
    types: [synchronize]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Remove patch-introduced extra blank line
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/app/runtime.rs')
          text = path.read_text()
          old = '    ("BISECT_START", "bisect"),\n];\n\n\n#[derive'
          new = '    ("BISECT_START", "bisect"),\n];\n\n#[derive'
          assert old in text
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Remove temporary workflow
        run: rm -f .github/workflows/issue26-whitespace.yml
      - name: Commit and push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'style: clean issue 26 port whitespace'
          git push origin HEAD:agent/issue-26-final
