name: Apply generated message policy

on:
  push:
    branches:
      - agent/constrain-generated-messages

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: agent/constrain-generated-messages
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply focused source changes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match in {path}, found {count}")
              target.write_text(text.replace(old, new, 1))

          replace_once(
              "src/app.rs",
              '''const DEFAULT_SIGN_COMMITS: bool = true;
          const SYSTEM_PROMPT: &str = include_str!("../prompts/system.md");''',
              '''const DEFAULT_SIGN_COMMITS: bool = true;
          const MAX_COMMIT_SUBJECT_CHARS: usize = 72;
          const MAX_COMMIT_MESSAGE_BYTES: usize = 4_096;
          const SYSTEM_PROMPT: &str = include_str!("../prompts/system.md");''',
          )

          replace_once(
              "src/app.rs",
              '''fn valid_conventional_message(message: &str) -> bool {
              let first = message.lines().next().unwrap_or_default();
              let Some((prefix, summary)) = first.split_once(": ") else {
                  return false;
              };
              if summary.trim().is_empty() {
                  return false;
              }
              let prefix = prefix.trim_end_matches('!');
              let kind = prefix
                  .split_once('(')
                  .map(|(kind, _)| kind)
                  .unwrap_or(prefix);
              matches!(
                  kind,
                  "feat"
                      | "fix"
                      | "docs"
                      | "style"
                      | "refactor"
                      | "perf"
                      | "test"
                      | "build"
                      | "ci"
                      | "chore"
                      | "revert"
              )
          }
          ''',
              '''fn valid_commit_type(kind: &str) -> bool {
              matches!(
                  kind,
                  "feat"
                      | "fix"
                      | "docs"
                      | "style"
                      | "refactor"
                      | "perf"
                      | "test"
                      | "build"
                      | "ci"
                      | "chore"
                      | "revert"
              )
          }

          fn valid_scope(scope: &str) -> bool {
              !scope.is_empty()
                  && scope.chars().all(|character| {
                      character.is_ascii_alphanumeric()
                          || matches!(character, '-' | '_' | '.' | '/')
                  })
          }

          fn valid_conventional_subject(subject: &str) -> bool {
              let Some((prefix, summary)) = subject.split_once(": ") else {
                  return false;
              };
              if summary.is_empty() || summary.trim() != summary {
                  return false;
              }
              let prefix = prefix.strip_suffix('!').unwrap_or(prefix);
              if let Some((kind, scope)) = prefix.split_once('(') {
                  valid_commit_type(kind)
                      && scope.strip_suffix(')').is_some_and(valid_scope)
              } else {
                  valid_commit_type(prefix)
              }
          }

          fn unsafe_message_character(character: char) -> bool {
              (character.is_control() && character != '\n')
                  || matches!(
                      character,
                      '\u{061c}'
                          | '\u{200b}'
                          | '\u{200c}'
                          | '\u{200d}'
                          | '\u{200e}'
                          | '\u{200f}'
                          | '\u{202a}'
                          | '\u{202b}'
                          | '\u{202c}'
                          | '\u{202d}'
                          | '\u{202e}'
                          | '\u{2060}'
                          | '\u{2066}'
                          | '\u{2067}'
                          | '\u{2068}'
                          | '\u{2069}'
                          | '\u{feff}'
                  )
          }

          fn trailer_like_line(line: &str) -> bool {
              let line = line.trim_start();
              let separator = line
                  .char_indices()
                  .find_map(|(index, character)| matches!(character, ':' | '=').then_some(index));
              let Some(separator) = separator else {
                  return false;
              };
              let token = &line[..separator];
              let value = &line[separator + 1..];
              !token.is_empty()
                  && !value.trim().is_empty()
                  && token.chars().all(|character| {
                      character.is_ascii_alphanumeric()
                          || matches!(character, '-' | '_' | '.')
                  })
          }

          fn validate_commit_message(message: &str) -> Result<String> {
              let message = message.trim();
              if message.is_empty() {
                  bail!("message is empty");
              }
              if message.len() > MAX_COMMIT_MESSAGE_BYTES {
                  bail!("message exceeds {MAX_COMMIT_MESSAGE_BYTES} bytes");
              }
              if message.chars().any(unsafe_message_character) {
                  bail!("message contains control, bidirectional, or zero-width characters");
              }
              if message.lines().any(|line| line.trim_end() != line) {
                  bail!("message contains trailing whitespace");
              }

              let mut lines = message.lines();
              let subject = lines.next().unwrap_or_default();
              if subject.chars().count() > MAX_COMMIT_SUBJECT_CHARS {
                  bail!("subject exceeds {MAX_COMMIT_SUBJECT_CHARS} characters");
              }
              if !valid_conventional_subject(subject) {
                  bail!("subject is not a supported Conventional Commit");
              }

              let body: Vec<&str> = lines.collect();
              if !body.is_empty() {
                  if body.len() < 2 || !body[0].is_empty() || body[1].is_empty() {
                      bail!("body must follow the subject after exactly one blank line");
                  }
                  if body[1..].iter().any(|line| trailer_like_line(line)) {
                      bail!("body contains trailer-like metadata");
                  }
              }
              Ok(message.to_owned())
          }
          ''',
          )

          replace_once(
              "src/app.rs",
              '''    let plan: Vec<PlanEntry> = serde_json::from_str(&strip_fence(raw))
                  .context("local AI did not return a JSON commit plan")?;''',
              '''    let mut plan: Vec<PlanEntry> = serde_json::from_str(&strip_fence(raw))
                  .context("local AI did not return a JSON commit plan")?;''',
          )

          replace_once(
              "src/app.rs",
              '''    for (index, entry) in plan.iter().enumerate() {
                  if !valid_conventional_message(entry.message.trim()) {
                      bail!(
                          "commit plan entry {} has an invalid Conventional Commit message",
                          index + 1
                      );
                  }
                  if entry.files.is_empty() {''',
              '''    for (index, entry) in plan.iter_mut().enumerate() {
                  entry.message = validate_commit_message(&entry.message).map_err(|error| {
                      anyhow!(
                          "commit plan entry {} has an invalid commit message: {error}",
                          index + 1
                      )
                  })?;
                  if entry.files.is_empty() {''',
          )

          replace_once(
              "src/app.rs",
              '''    #[test]
              fn rejects_duplicate_paths() {''',
              '''    #[test]
              fn accepts_canonical_message_with_rationale_body() {
                  let message = "fix(parser): reject ambiguous input\n\nKeep signed history free of generated metadata.";
                  assert_eq!(validate_commit_message(message).unwrap(), message);
              }

              #[test]
              fn rejects_generated_trailers() {
                  for trailer in [
                      "Co-authored-by: Mallory <mallory@example.com>",
                      "Signed-off-by: Mallory <mallory@example.com>",
                      "Reviewed-by=mallory",
                      "Change-Id: I0123456789",
                  ] {
                      let message = format!("fix: constrain messages\n\nExplain the rationale.\n\n{trailer}");
                      let error = validate_commit_message(&message).unwrap_err();
                      assert!(error.to_string().contains("trailer-like"));
                  }
              }

              #[test]
              fn rejects_malformed_subjects_and_body_layout() {
                  for message in [
                      "feat(scope: missing delimiter",
                      "feat(scope with spaces): invalid scope",
                      "fix: valid subject\nbody without separator",
                      "fix: valid subject\n\n\nbody after two blank lines",
                  ] {
                      assert!(validate_commit_message(message).is_err(), "accepted {message:?}");
                  }
              }

              #[test]
              fn rejects_oversized_and_unsafe_messages() {
                  let oversized = format!("fix: {}", "x".repeat(MAX_COMMIT_SUBJECT_CHARS));
                  assert!(
                      validate_commit_message(&oversized)
                          .unwrap_err()
                          .to_string()
                          .contains("subject exceeds")
                  );
                  assert!(validate_commit_message("fix: hide \\u{1b}[2Joutput").is_err());
                  assert!(validate_commit_message("fix: reverse \\u{202e}text").is_err());
              }

              #[test]
              fn parse_plan_canonicalizes_outer_whitespace() {
                  let staged = vec!["a".to_owned()];
                  let plan = parse_plan(
                      r#"[{"message":"  fix: normalize message  ","files":["a"]}]"#,
                      &staged,
                      8,
                  )
                  .unwrap();
                  assert_eq!(plan[0].message, "fix: normalize message");
              }

              #[test]
              fn rejects_duplicate_paths() {''',
          )

          replace_once(
              "prompts/plan.md",
              '''- Keep the first line concise and imperative.
          - Add a body only when it explains important rationale.
          - Never claim tests passed unless the diff proves it.''',
              '''- Keep the subject concise and imperative, with at most 72 characters.
          - Add a short prose body only when it explains important rationale.
          - Separate an optional body from the subject with exactly one blank line.
          - Do not emit trailers, attribution, sign-offs, review claims, issue-closing metadata, or other `Token: value` / `Token=value` lines.
          - Keep the complete message within 4096 bytes and avoid control, bidirectional, or zero-width characters.
          - Never claim tests passed unless the diff proves it.''',
          )

          replace_once(
              "README.md",
              '''- use supported Conventional Commit types;
          - assign every staged path to exactly one commit.''',
              '''- use a strictly parsed Conventional Commit subject of at most 72 characters;
          - keep the complete message within 4096 bytes and free of control or display-format characters;
          - use only an optional prose body separated by one blank line, with no trailer-like metadata;
          - assign every staged path to exactly one commit.''',
          )

          replace_once(
              "README.md",
              '''Signing authenticates the configured Git identity. It does not prove that the model's grouping or messages are correct.''',
              '''Signing authenticates the configured Git identity. Before signing, `git-autocommit` canonicalizes and validates the complete generated message, rejects trailer-like attribution or policy metadata, and bounds its size. Signing still does not prove that the model's grouping or prose are correct.''',
          )

          replace_once(
              "README.md",
              '''| `local AI did not return a JSON commit plan` | The model emitted malformed JSON or explanatory prose. |
          | `commit plan ... paths` | The model omitted, invented, or duplicated staged paths. |''',
              '''| `local AI did not return a JSON commit plan` | The model emitted malformed JSON or explanatory prose. |
          | `commit plan entry ... invalid commit message` | The model emitted a malformed, oversized, unsafe, or trailer-bearing message. |
          | `commit plan ... paths` | The model omitted, invented, or duplicated staged paths. |''',
          )

      - name: Format and validate
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo test --all-targets --all-features --locked
          cargo build --release --locked

      - name: Commit focused changes
        run: |
          rm .github/workflows/apply-message-policy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.rs prompts/plan.md README.md .github/workflows/apply-message-policy.yml
          git commit -m "validate generated commit messages"
          git push origin HEAD:agent/constrain-generated-messages
