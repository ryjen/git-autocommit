name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Format, lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply trailer policy review fix
        if: github.head_ref == 'agent/constrain-generated-messages'
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/app.rs')
          text = path.read_text()
          old = """            character.is_ascii_alphanumeric() || matches!(character, '-' | '_' | '.')
"""
          new = """            character.is_ascii_alphanumeric()
                || character.is_ascii_whitespace()
                || matches!(character, '-' | '_' | '.')
"""
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('unable to locate trailer token predicate')

          old_test = '            "Change-Id: I0123456789",\n'
          new_test = (
              '            "Change-Id: I0123456789",\n'
              '            "BREAKING CHANGE: incompatible behavior",\n'
              '            "Co-authored-by : Mallory <mallory@example.com>",\n'
          )
          if 'BREAKING CHANGE: incompatible behavior' not in text:
              if old_test not in text:
                  raise SystemExit('unable to locate trailer test insertion point')
              text = text.replace(old_test, new_test, 1)
          path.write_text(text)

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --all-features --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Commit trailer policy review fix
        if: github.head_ref == 'agent/constrain-generated-messages'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.rs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: reject spaced commit trailers"
          git push origin HEAD:agent/constrain-generated-messages
