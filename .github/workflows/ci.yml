name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  static-analysis:
    name: Format and static analysis
    runs-on: runner-git-autocommit
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Configure executable temp directory
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="${RUNNER_TEMP}/exec-tmp"
          mkdir -p "$tmpdir"
          echo "TMPDIR=$tmpdir" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo format-check

      - name: Run static analysis
        run: cargo static-analysis

  tests:
    name: Tests (${{ matrix.layer }})
    runs-on: runner-git-autocommit
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - layer: unit
            command: test-unit
          - layer: property
            command: test-property
          - layer: integration
            command: test-integration
          - layer: e2e
            command: test-e2e

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Configure executable temp directory
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="${RUNNER_TEMP}/exec-tmp"
          mkdir -p "$tmpdir"
          echo "TMPDIR=$tmpdir" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Run ${{ matrix.layer }} tests
        run: cargo ${{ matrix.command }}

  coverage:
    name: Coverage baseline
    runs-on: runner-git-autocommit
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Configure executable temp directory
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="${RUNNER_TEMP}/exec-tmp"
          mkdir -p "$tmpdir"
          echo "TMPDIR=$tmpdir" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@3d7d7cd5ac7f994c1892ae0c06165095b9139094 # v2.85.1
        with:
          tool: cargo-llvm-cov
          fallback: none

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Run coverage suite
        run: cargo coverage

      - name: Export coverage summary
        run: cargo coverage-json

      - name: Upload coverage summary
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: target/coverage-summary.json
          if-no-files-found: error
          retention-days: 14

  supply-chain:
    name: Dependency and supply-chain policy
    runs-on: runner-git-autocommit
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Run cargo-deny policy
        run: nix --extra-experimental-features "nix-command flakes" develop --command cargo supply-chain

  build:
    name: Release build
    runs-on: runner-git-autocommit
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Configure executable temp directory
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="${RUNNER_TEMP}/exec-tmp"
          mkdir -p "$tmpdir"
          echo "TMPDIR=$tmpdir" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build-release

  nix:
    name: Nix package reproducibility
    runs-on: runner-git-autocommit
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Show Nix version
        run: nix --version

      - name: Build Nix package
        run: nix --extra-experimental-features "nix-command flakes" build .#packages.x86_64-linux.default --no-link --print-build-logs

  validate:
    name: Format, lint, test, coverage, supply chain, Nix package, and build
    needs:
      - static-analysis
      - tests
      - coverage
      - supply-chain
      - build
      - nix
    if: ${{ always() }}
    runs-on: runner-git-autocommit
    timeout-minutes: 5

    steps:
      - name: Require all validation jobs
        env:
          STATIC_ANALYSIS_RESULT: ${{ needs.static-analysis.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          SUPPLY_CHAIN_RESULT: ${{ needs.supply-chain.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          NIX_RESULT: ${{ needs.nix.result }}
        run: |
          test "$STATIC_ANALYSIS_RESULT" = "success"
          test "$TESTS_RESULT" = "success"
          test "$COVERAGE_RESULT" = "success"
          test "$SUPPLY_CHAIN_RESULT" = "success"
          test "$BUILD_RESULT" = "success"
          test "$NIX_RESULT" = "success"
