name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Format, lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Format focused test
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/failure-path-atomicity'
        run: |
          cargo fmt --all
          unexpected="$(git diff --name-only | grep -v '^tests/failure_atomicity.rs$' || true)"
          if [ -n "$unexpected" ]; then
            echo "cargo fmt changed unexpected files:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          if ! git diff --quiet -- tests/failure_atomicity.rs; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add tests/failure_atomicity.rs
            git commit -m "style: format failure atomicity test"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --all-features --locked

      - name: Build release binary
        run: cargo build --release --locked
