name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Format, lint, test, coverage, supply chain, Nix package, and build
    runs-on: runner-git-autocommit
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure executable temp directory
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="${RUNNER_TEMP}/exec-tmp"
          mkdir -p "$tmpdir"
          echo "TMPDIR=$tmpdir" >> "$GITHUB_ENV"

      - name: Show Nix version
        run: nix --version

      - name: Check formatting
        run: nix develop --command cargo format-check

      - name: Run static analysis
        run: nix develop --command cargo static-analysis

      - name: Run unit tests
        run: nix develop --command cargo test-unit

      - name: Run property tests
        run: nix develop --command cargo test-property

      - name: Run integration tests
        run: nix develop --command cargo test-integration

      - name: Run end-to-end tests
        run: nix develop --command cargo test-e2e

      - name: Run coverage suite
        run: nix develop --command cargo coverage

      - name: Export coverage summary
        run: nix develop --command cargo coverage-json

      - name: Upload coverage summary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-summary
          path: target/coverage-summary.json
          if-no-files-found: error
          retention-days: 14

      - name: Run cargo-deny policy
        run: nix develop --command cargo supply-chain

      - name: Build release binary
        run: nix develop --command cargo build-release

      - name: Verify scoped Cargo cleanup safety contract
        run: bash scripts/test-ci-clean-cargo.sh

      - name: Build Nix package
        run: nix build .#packages.x86_64-linux.default --no-link --print-build-logs

      - name: Clean task-local Cargo outputs after coverage upload and build
        if: ${{ always() && hashFiles('scripts/ci-clean-cargo.sh') != '' }}
        run: nix develop --command bash scripts/ci-clean-cargo.sh
