name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  static-analysis:
    name: Format and static analysis
    runs-on: runner-git-autocommit
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo format-check

      - name: Run static analysis
        run: cargo static-analysis

  tests:
    name: Tests (${{ matrix.layer }})
    runs-on: runner-git-autocommit
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - layer: unit
            command: test-unit
          - layer: property
            command: test-property
          - layer: integration
            command: test-integration
          - layer: e2e
            command: test-e2e

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Run ${{ matrix.layer }} tests
        run: cargo ${{ matrix.command }}

  build:
    name: Release build
    runs-on: runner-git-autocommit
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build-release

  nix:
    name: Nix quality gates
    runs-on: runner-git-autocommit
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Show Nix version
        run: nix --version

      - name: Run flake checks
        run: nix --extra-experimental-features "nix-command flakes" flake check --print-build-logs

  validate:
    name: Format, lint, test, Nix, and build
    needs:
      - static-analysis
      - tests
      - build
      - nix
    if: ${{ always() }}
    runs-on: runner-git-autocommit
    timeout-minutes: 5

    steps:
      - name: Require all validation jobs
        env:
          STATIC_ANALYSIS_RESULT: ${{ needs.static-analysis.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          NIX_RESULT: ${{ needs.nix.result }}
        run: |
          test "$STATIC_ANALYSIS_RESULT" = "success"
          test "$TESTS_RESULT" = "success"
          test "$BUILD_RESULT" = "success"
          test "$NIX_RESULT" = "success"
