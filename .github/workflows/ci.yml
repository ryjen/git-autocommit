name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Format, lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: agent/bearer-token-file
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Apply bearer token file support
        run: |
          python .github/scripts/fix-bearer-token-file-patch.py
          python .github/scripts/apply-bearer-token-file.py

      - name: Format source
        run: cargo fmt --all

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --all-features --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Commit focused changes
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- src/app.rs README.md tests/bearer_token.rs)" ]; then
            echo "Product changes already applied."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app.rs README.md tests/bearer_token.rs
          git commit -m "feat: support bearer token files"
          git push origin HEAD:agent/bearer-token-file
