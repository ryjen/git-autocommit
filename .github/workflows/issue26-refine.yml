name: Issue 26 review fixes

on:
  push:
    branches:
      - agent/consolidate-review-boundaries

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply review fixes
        run: python3 .github/scripts/issue26_refine.py

      - name: Format Rust sources
        run: cargo fmt --all

      - name: Remove transient refinement machinery
        run: rm -f .github/workflows/issue26-refine.yml .github/scripts/issue26_refine.py

      - name: Commit review fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo "review fixes produced no changes" >&2; exit 1; }
          git commit -m "fix: harden consolidated review boundaries"
          git push origin HEAD:agent/consolidate-review-boundaries
