name: Apply total prompt limit

on:
  push:
    branches:
      - agent/bound-total-prompt
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: apply-total-prompt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'agent/bound-total-prompt'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: agent/bound-total-prompt
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply focused changes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          source_path = Path("src/app.rs")
          source = source_path.read_text()
          if "const DEFAULT_MAX_PROMPT_BYTES" not in source:
              source = replace_once(source, "const DEFAULT_MAX_DIFF_BYTES: usize = 120_000;\nconst DEFAULT_MAX_COMMITS: usize = 8;", "const DEFAULT_MAX_DIFF_BYTES: usize = 120_000;\nconst DEFAULT_MAX_PROMPT_BYTES: usize = 160_000;\nconst DEFAULT_MAX_COMMITS: usize = 8;", "prompt default")
              source = replace_once(source, "    max_diff_bytes: Option<usize>,\n    max_commits: Option<usize>,", "    max_diff_bytes: Option<usize>,\n    max_prompt_bytes: Option<usize>,\n    max_commits: Option<usize>,", "file config field")
              source = replace_once(source, "    max_diff_bytes: usize,\n    max_commits: usize,", "    max_diff_bytes: usize,\n    max_prompt_bytes: usize,\n    max_commits: usize,", "resolved settings field")
              source = replace_once(source, '''    let max_diff_bytes = env_parse::<usize>("GIT_AUTOCOMMIT_MAX_DIFF_BYTES")?
        .or(config.max_diff_bytes)
        .unwrap_or(DEFAULT_MAX_DIFF_BYTES);
    let max_commits = env_parse::<usize>("GIT_AUTOCOMMIT_MAX_COMMITS")?''', '''    let max_diff_bytes = env_parse::<usize>("GIT_AUTOCOMMIT_MAX_DIFF_BYTES")?
        .or(config.max_diff_bytes)
        .unwrap_or(DEFAULT_MAX_DIFF_BYTES);
    let max_prompt_bytes = env_parse::<usize>("GIT_AUTOCOMMIT_MAX_PROMPT_BYTES")?
        .or(config.max_prompt_bytes)
        .unwrap_or(DEFAULT_MAX_PROMPT_BYTES);
    let max_commits = env_parse::<usize>("GIT_AUTOCOMMIT_MAX_COMMITS")?''', "settings resolution")
              source = replace_once(source, '''        max_diff_bytes: positive_usize(max_diff_bytes, "max_diff_bytes")?,
        max_commits: positive_usize(max_commits, "max_commits")?,''', '''        max_diff_bytes: positive_usize(max_diff_bytes, "max_diff_bytes")?,
        max_prompt_bytes: positive_usize(max_prompt_bytes, "max_prompt_bytes")?,
        max_commits: positive_usize(max_commits, "max_commits")?,''', "resolved settings value")
              source = replace_once(source, '''fn validate_response_content_length(content_length: Option<u64>, max_bytes: usize) -> Result<()> {''', '''fn validate_prompt_size(system: &str, user: &str, max_bytes: usize) -> Result<()> {
    let prompt_bytes = system
        .len()
        .checked_add(user.len())
        .ok_or_else(|| anyhow!("rendered prompt size overflow"))?;
    if prompt_bytes > max_bytes {
        bail!(
            "rendered prompt is {prompt_bytes} bytes, exceeding the {max_bytes}-byte limit; reduce staged paths, max_diff_bytes, or custom prompt size"
        );
    }
    Ok(())
}

fn validate_response_content_length(content_length: Option<u64>, max_bytes: usize) -> Result<()> {''', "prompt validator")
              source = replace_once(source, '''fn request_plan(settings: &Settings, system: &str, user: &str) -> Result<String> {
    let client = Client::builder()''', '''fn request_plan(settings: &Settings, system: &str, user: &str) -> Result<String> {
    validate_prompt_size(system, user, settings.max_prompt_bytes)?;
    let client = Client::builder()''', "request boundary")
              source = replace_once(source, '''    #[test]
    fn accepts_response_at_declared_and_streamed_limit() {''', '''    #[test]
    fn accepts_prompt_at_limit() {
        validate_prompt_size("sys", "user", 7).unwrap();
    }

    #[test]
    fn rejects_prompt_over_limit() {
        let error = validate_prompt_size("sys", "user", 6).unwrap_err();
        assert!(error.to_string().contains("7 bytes"));
        assert!(error.to_string().contains("6-byte limit"));
    }

    #[test]
    fn default_prompt_limit_exceeds_diff_budget() {
        let settings = settings_for(&[], FileConfig::default());
        assert!(settings.max_prompt_bytes > settings.max_diff_bytes);
    }

    #[test]
    fn accepts_response_at_declared_and_streamed_limit() {''', "prompt tests")
              source_path.write_text(source)

          readme_path = Path("README.md")
          readme = readme_path.read_text()
          if "max_prompt_bytes = 160000" not in readme:
              readme = replace_once(readme, '''Diff content is bounded by `max_diff_bytes`; later content may be truncated or omitted. A remote endpoint may therefore receive source code, credentials, or other sensitive staged content. Review the endpoint's transport, access, retention, and training policies before using it with private repositories.''', '''Diff content is bounded by `max_diff_bytes`; later content may be truncated or omitted. After all placeholders are expanded, the combined system and plan prompt text is bounded by `max_prompt_bytes`, including path lists, statistics, headings, and custom prompt content. Oversized prompts are rejected before the endpoint is contacted. A remote endpoint may therefore receive source code, credentials, or other sensitive staged content. Review the endpoint's transport, access, retention, and training policies before using it with private repositories.''', "data boundary documentation")
              readme = replace_once(readme, '''max_diff_bytes = 120000
max_commits = 8''', '''max_diff_bytes = 120000
max_prompt_bytes = 160000
max_commits = 8''', "config example")
              readme = replace_once(readme, '''| Maximum diff bytes | — | `GIT_AUTOCOMMIT_MAX_DIFF_BYTES` | `max_diff_bytes` | `120000` |
| Maximum commits | — | `GIT_AUTOCOMMIT_MAX_COMMITS` | `max_commits` | `8` |''', '''| Maximum diff bytes | — | `GIT_AUTOCOMMIT_MAX_DIFF_BYTES` | `max_diff_bytes` | `120000` |
| Maximum prompt bytes | — | `GIT_AUTOCOMMIT_MAX_PROMPT_BYTES` | `max_prompt_bytes` | `160000` |
| Maximum commits | — | `GIT_AUTOCOMMIT_MAX_COMMITS` | `max_commits` | `8` |''', "config table")
              readme = replace_once(readme, '''- Large diffs are truncated according to `max_diff_bytes`.
- The endpoint must implement the expected OpenAI Chat Completions response shape.''', '''- Large diffs are truncated according to `max_diff_bytes`.
- The complete expanded prompt must fit within `max_prompt_bytes`; repositories with unusually many or long paths may require a larger ceiling or a smaller staged set.
- The endpoint must implement the expected OpenAI Chat Completions response shape.''', "limitations")
              readme = replace_once(readme, '''| `local AI returned an error` | The endpoint returned a non-success HTTP status. |
| `local AI response exceeds the ...-byte limit` | The endpoint returned more than the fixed 256 KiB safety ceiling. |''', '''| `local AI returned an error` | The endpoint returned a non-success HTTP status. |
| `rendered prompt is ... exceeding the ...-byte limit` | Expanded prompt text, including metadata and custom prompts, exceeds `max_prompt_bytes`. |
| `local AI response exceeds the ...-byte limit` | The endpoint returned more than the fixed 256 KiB safety ceiling. |''', "troubleshooting")
              readme_path.write_text(readme)

      - name: Format
        run: cargo fmt --all

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --all-features --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Commit focused changes
        shell: bash
        run: |
          if git diff --quiet -- src/app.rs README.md; then
            echo "Product changes already applied."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app.rs README.md
          git commit -m "fix: bound complete prompt size"
          git push origin HEAD:agent/bound-total-prompt
