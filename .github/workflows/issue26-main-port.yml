name: Issue 26 mainline port

on:
  push:
    branches:
      - agent/issue-26-main-port

permissions:
  contents: write

jobs:
  port:
    if: ${{ !contains(github.event.head_commit.message, 'refactor: finish issue 26 consolidation') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply port
        run: python .github/scripts/issue26-main-port.py
      - name: Format
        run: cargo fmt --all
      - name: Check
        run: cargo check --all-targets
      - name: Test
        run: cargo test --all-targets
      - name: Remove temporary patch machinery
        run: rm -f .github/scripts/issue26-main-port.py .github/workflows/issue26-main-port.yml
      - name: Commit and push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'refactor: finish issue 26 consolidation'
          git push origin HEAD:agent/issue-26-main-port
