name: Issue 58 fix

on:
  push:
    branches:
      - agent/issue-58-ci-validation-fix

permissions:
  contents: write

jobs:
  fix:
    runs-on: runner-git-autocommit
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/issue-58-ci-validation-fix
          persist-credentials: true
          fetch-depth: 0

      - name: Patch inherited CI defects
        shell: bash
        run: |
          set -euo pipefail

          sed -i 's/use tempfile::{TempDir, tempdir};/use tempfile::{TempDir, tempdir, tempdir_in};/' tests/failure_atomicity.rs
          sed -i 's/let directory = tempdir().expect("temporary Git wrapper directory");/let directory = tempdir_in(env!("CARGO_TARGET_TMPDIR")).expect("temporary Git wrapper directory");/' tests/failure_atomicity.rs

          sed -i '/              git$/a\              python3' flake.nix

          sed -i '/      - name: Configure executable temp directory/,/      - name: Install Rust toolchain/d' .github/workflows/release.yml
          sed -i 's/VERSION="$(python3 - <<'"'"'PY'"'"'/VERSION="$(nix --extra-experimental-features "nix-command flakes" develop --command python3 - <<'"'"'PY'"'"'/' .github/workflows/release.yml
          sed -i 's/run: cargo package --locked --no-verify/run: nix --extra-experimental-features "nix-command flakes" develop --command cargo package --locked --no-verify/' .github/workflows/release.yml

      - name: Validate formatting and static analysis
        run: |
          nix --extra-experimental-features "nix-command flakes" develop --command cargo fmt --all
          nix --extra-experimental-features "nix-command flakes" develop --command cargo format-check
          nix --extra-experimental-features "nix-command flakes" develop --command cargo static-analysis

      - name: Validate integration tests
        run: nix --extra-experimental-features "nix-command flakes" develop --command cargo test-integration

      - name: Validate release package path
        run: nix --extra-experimental-features "nix-command flakes" develop --command cargo package --locked --no-verify

      - name: Commit validated fix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/issue58-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'ci: restore deterministic integration and release validation'
          git push origin HEAD:agent/issue-58-ci-validation-fix
