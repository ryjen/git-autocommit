name: Release lock sync

on:
  push:
    branches:
      - agent/release-v0.2.0
    paths:
      - Cargo.toml
      - .github/workflows/release-lock-sync.yml

permissions:
  contents: write

jobs:
  sync-lock-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Sync root package version in Cargo.lock
        shell: python
        run: |
          from pathlib import Path
          import tomllib

          manifest = tomllib.loads(Path("Cargo.toml").read_text(encoding="utf-8"))
          version = manifest["package"]["version"]
          path = Path("Cargo.lock")
          text = path.read_text(encoding="utf-8")
          marker = '[[package]]\nname = "git-autocommit"\nversion = "0.1.0"'
          replacement = f'[[package]]\nname = "git-autocommit"\nversion = "{version}"'
          if text.count(marker) != 1:
              raise SystemExit("expected exactly one 0.1.0 root package entry")
          path.write_text(text.replace(marker, replacement, 1), encoding="utf-8")
      - name: Commit synchronized lockfile
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock
          git diff --cached --quiet && exit 0
          git commit -m "release: sync Cargo.lock version"
          git push
