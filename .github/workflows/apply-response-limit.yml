name: Apply bounded AI response safety slice

on:
  push:
    branches:
      - agent/bound-ai-response
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'push' || github.head_ref == 'agent/bound-ai-response'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: agent/bound-ai-response
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply focused changes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match in {path}, found {count}")
              target.write_text(text.replace(old, new, 1))

          replace_once(
              "src/app.rs",
              "use std::io::Write;",
              "use std::io::{Read, Write};",
          )

          replace_once(
              "src/app.rs",
              '''const MAX_COMMIT_MESSAGE_BYTES: usize = 4_096;
          const SYSTEM_PROMPT: &str = include_str!("../prompts/system.md");''',
              '''const MAX_COMMIT_MESSAGE_BYTES: usize = 4_096;
          const MAX_AI_RESPONSE_BYTES: usize = 256 * 1024;
          const SYSTEM_PROMPT: &str = include_str!("../prompts/system.md");''',
          )

          replace_once(
              "src/app.rs",
              '''fn request_plan(settings: &Settings, system: &str, user: &str) -> Result<String> {
              let client = Client::builder()
                  .timeout(Duration::from_secs_f64(settings.timeout_seconds))
                  .build()?;
              let response = client
                  .post(format!(
                      "{}/chat/completions",
                      settings.base_url.trim_end_matches('/')
                  ))
                  .json(&json!({
                      "model": settings.model,
                      "temperature": 0.1,
                      "messages": [
                          {"role": "system", "content": system},
                          {"role": "user", "content": user}
                      ]
                  }))
                  .send()
                  .context("local AI unavailable")?
                  .error_for_status()
                  .context("local AI returned an error")?;
              let document: serde_json::Value = response.json().context("local AI returned invalid JSON")?;
              document["choices"][0]["message"]["content"]
                  .as_str()
                  .map(ToOwned::to_owned)
                  .ok_or_else(|| anyhow!("local AI response message was not text"))
          }
          ''',
              '''fn validate_response_content_length(content_length: Option<u64>, max_bytes: usize) -> Result<()> {
              let max_bytes =
                  u64::try_from(max_bytes).context("response byte limit is too large")?;
              if content_length.is_some_and(|length| length > max_bytes) {
                  bail!("local AI response exceeds the {max_bytes}-byte limit");
              }
              Ok(())
          }

          fn read_response_body<R: Read>(reader: R, max_bytes: usize) -> Result<Vec<u8>> {
              let read_limit = max_bytes
                  .checked_add(1)
                  .and_then(|value| u64::try_from(value).ok())
                  .ok_or_else(|| anyhow!("response byte limit is too large"))?;
              let mut reader = reader.take(read_limit);
              let mut body = Vec::with_capacity(max_bytes.min(8 * 1024));
              reader
                  .read_to_end(&mut body)
                  .context("unable to read local AI response")?;
              if body.len() > max_bytes {
                  bail!("local AI response exceeds the {max_bytes}-byte limit");
              }
              Ok(body)
          }

          fn request_plan(settings: &Settings, system: &str, user: &str) -> Result<String> {
              let client = Client::builder()
                  .timeout(Duration::from_secs_f64(settings.timeout_seconds))
                  .build()?;
              let response = client
                  .post(format!(
                      "{}/chat/completions",
                      settings.base_url.trim_end_matches('/')
                  ))
                  .json(&json!({
                      "model": settings.model,
                      "temperature": 0.1,
                      "messages": [
                          {"role": "system", "content": system},
                          {"role": "user", "content": user}
                      ]
                  }))
                  .send()
                  .context("local AI unavailable")?
                  .error_for_status()
                  .context("local AI returned an error")?;
              validate_response_content_length(response.content_length(), MAX_AI_RESPONSE_BYTES)?;
              let body = read_response_body(response, MAX_AI_RESPONSE_BYTES)?;
              let document: serde_json::Value =
                  serde_json::from_slice(&body).context("local AI returned invalid JSON")?;
              document["choices"][0]["message"]["content"]
                  .as_str()
                  .map(ToOwned::to_owned)
                  .ok_or_else(|| anyhow!("local AI response message was not text"))
          }
          ''',
          )

          replace_once(
              "src/app.rs",
              '''    #[test]
              fn validates_complete_atomic_plan() {''',
              '''    #[test]
              fn accepts_response_at_declared_and_streamed_limit() {
                  validate_response_content_length(Some(4), 4).unwrap();
                  assert_eq!(read_response_body(&b"data"[..], 4).unwrap(), b"data");
              }

              #[test]
              fn accepts_unknown_response_length_within_limit() {
                  validate_response_content_length(None, 4).unwrap();
                  assert_eq!(read_response_body(&b"data"[..], 4).unwrap(), b"data");
              }

              #[test]
              fn rejects_declared_oversized_response_before_reading() {
                  let error = validate_response_content_length(Some(5), 4).unwrap_err();
                  assert!(error.to_string().contains("4-byte limit"));
              }

              #[test]
              fn rejects_streamed_oversized_response() {
                  let error = read_response_body(&b"extra"[..], 4).unwrap_err();
                  assert!(error.to_string().contains("4-byte limit"));
              }

              #[test]
              fn validates_complete_atomic_plan() {''',
          )

          replace_once(
              "README.md",
              '''Diff content is bounded by `max_diff_bytes`; later content may be truncated or omitted. A remote endpoint may therefore receive source code, credentials, or other sensitive staged content. Review the endpoint's transport, access, retention, and training policies before using it with private repositories.

          ### Hooks and policy enforcement''',
              '''Diff content is bounded by `max_diff_bytes`; later content may be truncated or omitted. A remote endpoint may therefore receive source code, credentials, or other sensitive staged content. Review the endpoint's transport, access, retention, and training policies before using it with private repositories.

          ### Response handling

          The HTTP response body is capped at 256 KiB before JSON deserialization. A declared `Content-Length` above the limit is rejected before reading the body. Responses without a trustworthy length, including chunked responses, are streamed only through the limit plus one byte and rejected if oversized.

          ### Hooks and policy enforcement''',
          )

          replace_once(
              "README.md",
              '''| `local AI returned an error` | The endpoint returned a non-success HTTP status. |
          | `local AI did not return a JSON commit plan` | The model emitted malformed JSON or explanatory prose. |''',
              '''| `local AI returned an error` | The endpoint returned a non-success HTTP status. |
          | `local AI response exceeds the ...-byte limit` | The endpoint returned more than the fixed 256 KiB safety ceiling. |
          | `local AI did not return a JSON commit plan` | The model emitted malformed JSON or explanatory prose. |''',
          )

      - name: Format
        run: cargo fmt --all

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --all-features --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Commit focused changes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app.rs README.md
          git commit -m "fix: bound AI response bodies"
          git push origin HEAD:agent/bound-ai-response
