name: Refine property tests

on:
  push:
    branches:
      - agent/property-test-model-inputs
    paths:
      - .github/workflows/refine-property-tests.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/property-test-model-inputs
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Replace vacuous generators
        run: echo '' | base64 -d | python3

      - name: Format and validate
        run: |
          cargo fmt --all
          cargo format-check
          cargo static-analysis
          cargo test-property
          cargo test-unit

      - name: Commit source refinement
        run: |
          git config user.name "RJ"
          git config user.email "rybertjen@gmail.com"
          git add src/app.rs
          git commit -m "test: strengthen property-test generators"
          git push origin HEAD:agent/property-test-model-inputs
