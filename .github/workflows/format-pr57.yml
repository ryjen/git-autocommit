name: Fix PR 57

on:
  push:
    branches:
      - agent/issue-26-final

permissions:
  contents: write

jobs:
  fix:
    runs-on: runner-git-autocommit
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/issue-26-final
          persist-credentials: true

      - name: Apply CI blocker fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          replace(
              "src/app.rs",
              'const REVIEW_ENV: &str = "GIT_AUTOCOMMIT_REVIEW";\n',
              'const REVIEW_ENV: &str = "GIT_AUTOCOMMIT_REVIEW";\nconst TEST_GIT_ENV: &str = "GIT_AUTOCOMMIT_TEST_GIT";\n',
          )
          replace(
              "src/app.rs",
              'fn git_command() -> Command {\n    let mut command = Command::new("git");\n',
              'fn git_command() -> Command {\n    let program = env::var_os(TEST_GIT_ENV).unwrap_or_else(|| OsString::from("git"));\n    let mut command = Command::new(program);\n    command.env_remove(TEST_GIT_ENV);\n',
          )
          replace(
              "tests/failure_atomicity.rs",
              'const REAL_GIT_ENV: &str = "GIT_AUTOCOMMIT_TEST_REAL_GIT";\n',
              'const GIT_BIN_ENV: &str = "GIT_AUTOCOMMIT_TEST_GIT";\nconst REAL_GIT_ENV: &str = "GIT_AUTOCOMMIT_TEST_REAL_GIT";\n',
          )
          replace(
              "tests/failure_atomicity.rs",
              '        .env("PATH", env::join_paths(paths).expect("join wrapper PATH"))\n        .env(REAL_GIT_ENV, real_git)\n',
              '        .env("PATH", env::join_paths(paths).expect("join wrapper PATH"))\n        .env(GIT_BIN_ENV, wrapper.directory.path().join("git"))\n        .env(REAL_GIT_ENV, real_git)\n',
          )
          replace(
              "flake.nix",
              '              cargo-llvm-cov\n              clippy\n              git\n',
              '              cargo-llvm-cov\n              clippy\n              git\n              llvmPackages.llvm\n              python3\n',
          )
          replace(
              "flake.nix",
              '            RUST_BACKTRACE = "1";\n\n            shellHook =',
              '            RUST_BACKTRACE = "1";\n            LLVM_COV = "${pkgs.llvmPackages.llvm}/bin/llvm-cov";\n            LLVM_PROFDATA = "${pkgs.llvmPackages.llvm}/bin/llvm-profdata";\n\n            shellHook =',
          )
          replace(
              ".github/workflows/release.yml",
              '''      - name: Configure executable temp directory\n        shell: bash\n        run: |\n          set -euo pipefail\n          tmpdir="${RUNNER_TEMP}/exec-tmp"\n          mkdir -p "$tmpdir"\n          echo "TMPDIR=$tmpdir" >> "$GITHUB_ENV"\n\n      - name: Install Rust toolchain\n        uses: dtolnay/rust-toolchain@stable\n\n''',
              '',
          )
          replace(
              ".github/workflows/release.yml",
              '          VERSION="$(python3 - <<\'PY\'\n',
              '          VERSION="$(nix --extra-experimental-features "nix-command flakes" develop --command python3 - <<\'PY\'\n',
          )
          replace(
              ".github/workflows/release.yml",
              '      - name: Validate crate package\n        run: cargo package --locked --no-verify\n',
              '      - name: Validate crate package\n        run: nix --extra-experimental-features "nix-command flakes" develop --command cargo package --locked --no-verify\n',
          )
          PY

      - name: Format Rust sources
        run: nix --extra-experimental-features "nix-command flakes" develop --command cargo fmt --all

      - name: Validate format and static analysis
        run: |
          nix --extra-experimental-features "nix-command flakes" develop --command cargo format-check
          nix --extra-experimental-features "nix-command flakes" develop --command cargo static-analysis

      - name: Validate integration failure atomicity
        run: nix --extra-experimental-features "nix-command flakes" develop --command cargo test-integration

      - name: Validate coverage tooling
        run: nix --extra-experimental-features "nix-command flakes" develop --command cargo coverage

      - name: Validate package
        run: nix --extra-experimental-features "nix-command flakes" build .#packages.x86_64-linux.default --no-link --print-build-logs

      - name: Remove temporary workflow and commit fixes
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/format-pr57.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: restore consolidated CI invariants'
          git push origin HEAD:agent/issue-26-final
