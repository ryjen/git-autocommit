name: Add property tests

on:
  push:
    branches:
      - agent/property-test-model-inputs
    paths:
      - .github/workflows/add-property-tests.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/property-test-model-inputs
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Add proptest dependency
        run: cargo add proptest@1 --dev

      - name: Apply property-test coverage
        run: echo '' | base64 -d | python3

      - name: Format
        run: cargo fmt --all

      - name: Validate
        run: |
          cargo format-check
          cargo static-analysis
          cargo test-unit
          cargo test-property
          cargo test-integration
          cargo test-e2e
          cargo build-release

      - name: Commit changes
        run: |
          git config user.name "RJ"
          git config user.email "rybertjen@gmail.com"
          git add Cargo.toml Cargo.lock .cargo/config.toml .github/workflows/ci.yml docs/testing.md src/app.rs
          git commit -m "test: add property-based adversarial coverage"
          git push origin HEAD:agent/property-test-model-inputs
