name: Issue 30 wrapper fix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: runner-git-autocommit
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Patch wrapper temp location
        shell: bash
        run: |
          set -euo pipefail
          nix --extra-experimental-features "nix-command flakes" develop --command python3 - <<'PY'
          from pathlib import Path

          path = Path("tests/failure_atomicity.rs")
          source = path.read_text()
          old = '    let directory = tempdir().expect("temporary Git wrapper directory");'
          new = '''    let directory = env::var_os("RUNNER_TEMP")
              .map(PathBuf::from)
              .map_or_else(
                  || tempdir().expect("temporary Git wrapper directory"),
                  |path| tempfile::tempdir_in(path).expect("temporary Git wrapper directory"),
              );'''
          if source.count(old) != 1:
              raise SystemExit(f"expected exactly one wrapper tempdir expression, found {source.count(old)}")
          path.write_text(source.replace(old, new, 1))
          PY
          nix --extra-experimental-features "nix-command flakes" develop --command cargo fmt --all
      - name: Validate integration suite
        run: nix --extra-experimental-features "nix-command flakes" develop --command cargo test-integration
      - name: Validate coverage suite
        run: nix --extra-experimental-features "nix-command flakes" develop --command cargo coverage
      - name: Remove temporary validation files
        run: rm -f .github/workflows/issue30-wrapper-fix.yml ISSUE30_PORT_NOTE.md
      - name: Commit and push final change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898298+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'test: keep git fault wrapper on executable temp storage'
          git push origin HEAD:agent/coverage-exec-wrapper
